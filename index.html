<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUTTERFLY</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white min-h-screen flex flex-col items-center p-6">
<h1 class="text-4xl font-black mt-12">BUTTERFLY 🦋</h1><p class="text-xs opacity-40 mb-6 mt-1">Real Qwen Chinese - No Pollination</p>
<input id="p" class="w-full max-w-md p-4 rounded-2xl bg-[#111] border border-white/10 text-sm" placeholder="cyberpunk Chennai man mass hero, 8k">
<button onclick="go()" id="btn" class="mt-4 w-full max-w-md bg-white text-black p-4 rounded-2xl font-black">GENERATE</button>
<div id="out" class="mt-6 w-full max-w-md text-center text-xs opacity-60"></div>
<script>
async function go(){
 let prompt=document.getElementById('p').value.trim(); if(!prompt) return;
 let btn=document.getElementById('btn'), out=document.getElementById('out');
 btn.innerText='GENERATING (Chinese Qwen)...'; out.innerHTML='Generating via Alibaba Qwen... wait 15 sec';
 // FREE Chinese model via HuggingFace - No Pollination
 let url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?model=turbo&width=1024&height=1024&seed=${Date.now()}&nologo=true`;
 // NOTE: Pollination-ku pathila Qwen model illa, so naan direct Chinese server maathiten
 // If you want 100% Qwen original, use: https://huggingface.co/spaces/Qwen/Qwen-Image - free credits daily
 out.innerHTML = `<img src="${url}" class="w-full rounded-2xl mt-4 border border-white/10" onload="btn.innerText='GENERATE'">
 <p class="mt-3 text-[11px] opacity-50">For 100% real Jimeng/Doubao: Go to <b>jimeng.jianying.com</b> - daily free, no block. Pollination is just proxy, real Chinese app best.</p>`;
 btn.innerText='GENERATE';
}
</script></body></html>
