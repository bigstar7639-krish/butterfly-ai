<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUTTERFLY</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-6">
<h1 class="text-4xl font-black mb-2">BUTTERFLY 🦋</h1>
<p class="text-xs opacity-40 mb-8">Chinese Top Free AI</p>
<input id="p" class="w-full max-w-md p-4 rounded-2xl bg-[#111] border border-white/10 text-sm outline-none" placeholder="Describe your image...">
<button onclick="go()" id="btn" class="mt-4 w-full max-w-md bg-white text-black p-4 rounded-2xl font-black">GENERATE</button>
<div id="out" class="mt-6 w-full max-w-md"></div>
<script>
function go(){
 let prompt=document.getElementById('p').value.trim();
 if(!prompt) return;
 let btn=document.getElementById('btn'), out=document.getElementById('out');
 btn.innerText='GENERATING...';
 let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&model=flux&seed=${Date.now()}`;
 out.innerHTML=`<img src="${url}" class="w-full rounded-2xl mt-4" onload="btn.innerText='GENERATE'"><a href="${url}" target="_blank" class="block mt-3 bg-white text-black p-3 rounded-xl text-center font-bold text-sm">Download</a>`;
}
</script>
</body>
</html>
